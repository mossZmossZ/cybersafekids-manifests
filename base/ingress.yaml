apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cybersafekids-ingress
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts:
        - cyber-safekids.com
        - api.cyber-safekids.com
      secretName: cybersafekids-tls
  rules:
    - host: cyber-safekids.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.cyber-safekids.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
